[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc5m-research"
version = "0.2.0"
description = "Historical BTC binary-market research: pricing, data engineering, inventory and policy evaluation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
keywords = ["market-microstructure", "prediction-markets", "market-making", "quantitative-research"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/ErenEgeCelik/crypto-updown-prediction-market-research"

[tool.setuptools.packages.find]
where = ["src"]
